name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission
        run: chmod +x DataBottleApp/gradlew
      - name: Build APK
        run: |
          cd DataBottleApp
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataBottle-APK
          path: DataBottleApp/app/build/outputs/apk/debug/app-debug.apk
